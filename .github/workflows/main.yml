name: "Build kernels"

env:
  OUT_DIR: "out"
  KERNEL_VERSION: "5.15"
  ANDROID_VERSION: "13"
  KBUILD_BUILD_USER: "NotPichayut"
  KBUILD_BUILD_HOST: "Github"

on:
  workflow_dispatch:
    inputs:
      kernelSourceURL:
        description: "Kernel source URL"
        required: true
        type: string
        default: "https://github.com/The-Angel-Place-Sapphire/kernel_xiaomi_sapphire"
      kernelBranch:
        description: "Kernel branch"
        required: false
        type: string
        default: "lineage-23.2"
      kernelDevice:
        description: "Device (used for defconfig)"
        required: true
        type: string
        default: "gki"
      localVersion:
        description: "Custom localversion name (e.g., -mybuild)"
        required: false
        type: string
        default: ""
      buildKSU:
        description: "Build KSU variant?"
        required: true
        type: choice
        default: "both"
        options:
          - "noksu"
          - "ksu"
          - "both"

jobs:
  Build-Kernel:
    name: "🚀 Build Kernel"
    runs-on: ubuntu-latest
    strategy:
      matrix:
        variant: ${{ fromJSON(
          inputs.buildKSU == 'both' && '["noksu", "ksu"]' ||
          inputs.buildKSU == 'ksu' && '["ksu"]' ||
          '["noksu"]' ) }}
    env:
      kernelDir: common_${{ github.event.inputs.kernelDevice }}
      kernelName: common
      DEFCONFIG_NAME: ${{ github.event.inputs.kernelDevice }}_defconfig
      WORK_DIR: ${{ github.workspace }}

    steps:
      - name: "✨ Setup workspace"
        run: |
          mkdir -p $kernelDir
          echo "BUILD_TIME=$(date +'%Y-%m-%d')" >> $GITHUB_ENV
          sudo apt-get update -qq
          sudo apt-get install -y repo rsync aria2

      - name: 📐 Setup SWAP 15GB
        uses: pierotofy/set-swap-space@master
        with:
            swap-size-gb: 15
            
      - name: 📐 Tune Swap
        run: |
            echo "vm.swappiness=80" | sudo tee -a /etc/sysctl.conf
            sudo sysctl -p

      - name: "🌟 Clone kernel source"
        working-directory: ./${{ env.kernelDir }}
        run: |
          git clone --recursive --branch ${{ github.event.inputs.kernelBranch }} \
            ${{ github.event.inputs.kernelSourceURL }} ${{ env.kernelName }} --depth=1

      - name: "📥 Initialize repo & clang-r614150"
        working-directory: ${{ env.WORK_DIR}}
        run: |
         repo init -u https://android.googlesource.com/kernel/manifest -b common-android13-5.15-lts --depth=1
         repo sync --optimized-fetch --prune --no-clone-bundle --no-tags -j$(nproc --all)
    
         rm -rf .repo
         rm -rf common

         # Download Clang r614150
         aria2c -x 16 -s 16 -d prebuilts/clang/host/linux-x86 -o clang-r614150.tar.gz \
           "https://github.com/yougotme101/clang/releases/download/v1.0.2/clang-r614150.tar.gz"

         mkdir -p prebuilts/clang/host/linux-x86/clang-r614150
         tar -xzf prebuilts/clang/host/linux-x86/clang-r614150.tar.gz -C prebuilts/clang/host/linux-x86/clang-r614150
         rm -f prebuilts/clang/host/linux-x86/clang-r614150.tar.gz

         # Remove any other Clang versions that might have been synced
         rm -rf prebuilts/clang/host/linux-x86/clang-3289846 \
           prebuilts/clang/host/linux-x86/clang-r547379 \
           prebuilts/clang/host/linux-x86/clang-r584948 \
           prebuilts/clang/host/linux-x86/clang-r596125 \
           prebuilts/clang/host/linux-x86/clang-stable
         
         sed -i \
          -e 's/^BRANCH=.*/BRANCH=android13-5.15/' \
          -e 's/^CLANG_VERSION=.*/CLANG_VERSION=r614150/' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.constants
    
         sed -i '/^DEFCONFIG=gki_defconfig/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '$a\DEFCONFIG=${{ env.DEFCONFIG_NAME }}' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki
         sed -i '/^POST_DEFCONFIG_CMDS="check_defconfig"/d' ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki

         sed -i \
          -e '/^KMI_SYMBOL_LIST_STRICT_MODE=/d' \
          -e '/^TRIM_NONLISTED_KMI=/d' \
          -e '/^KMI_ENFORCED=/d' \
          -e '$a\KMI_SYMBOL_LIST_STRICT_MODE=0' \
          -e '$a\TRIM_NONLISTED_KMI=0' \
          -e '$a\KMI_ENFORCED=0' \
          -e '/^MODULES_ORDER=/d' \
          -e '/^MODULES_LIST=/d' \
         ${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64

      - name: "⚙️ Configure kernel"
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          # Define the config file path
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          
          # Set localversion
          if [ -n "${{ github.event.inputs.localVersion }}" ]; then
            echo "CONFIG_LOCALVERSION=\"${{ github.event.inputs.localVersion }}\"" >> "$CONFIG_FILE"
          fi

          # strip -android13-8-g<hash>: setlocalversion prints only localVersion
          printf "#!/bin/sh\nprintf '%%s' '%s'\n" "${{ github.event.inputs.localVersion }}" > scripts/setlocalversion

          # force compile user/host (build.sh overrides KBUILD_BUILD_*)
          sed -i "/^[[:space:]]*UTS_VERSION=\"#\$VERSION\"/i LINUX_COMPILE_BY=$KBUILD_BUILD_USER\nLINUX_COMPILE_HOST=$KBUILD_BUILD_HOST" scripts/mkcompile_h
          
          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KALLSYMS=y
          CONFIG_TMPFS_XATTR=y
          CONFIG_TMPFS_POSIX_ACL=y
          EOF

      - name: "🔧 Setup BakaSU"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          rm -rf ./KernelSU ./drivers/kernelsu

          echo "📦 Installing KSU..."
          curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -s
          
          echo "✔ KSU installed successfully"

          CONFIG_FILE="arch/arm64/configs/${{ env.DEFCONFIG_NAME }}"
          cat >> "$CONFIG_FILE" << 'EOF'
          CONFIG_KSU=y
          EOF

          echo "🎉 BakaSU setup complete!"

      - name: "🔍 Debug eventpoll"
        if: matrix.variant == 'ksu'
        working-directory: ./${{ env.kernelDir }}/${{ env.kernelName }}
        run: |
          git diff --stat | tail -40
          echo "=== eventpoll.c diff ==="
          git diff fs/eventpoll.c | head -80

      - name: "🔨 Build kernel"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          LTO=thin BUILD_CONFIG=${{ env.kernelDir }}/${{ env.kernelName }}/build.config.gki.aarch64 \
          build/build.sh -j$(nproc --all)

      - name: "📦 Prepare artifact"
        working-directory: ${{ env.WORK_DIR }}
        run: |
          cp out/dist/Image Image.${{ matrix.variant }}

      - name: "📤 Upload kernel"
        uses: actions/upload-artifact@v4
        with:
          name: kernel-${{ matrix.variant }}
          path: ${{ env.WORK_DIR }}/Image.${{ matrix.variant }}
          retention-days: 3

  Package-Kernels:
    name: "📦 Package kernels"
    runs-on: ubuntu-latest
    needs: Build-Kernel
    steps:
      - name: "📥 Download artifacts"
        uses: actions/download-artifact@v4
        with:
          path: ./kernels/

      - name: "📦 Create flashable ZIP"
        run: |
          BUILD_TIME=$(date +'%Y-%m-%d')
          git clone --depth=1 https://github.com/NotPichayut/AnyKernel3 -b master AnyKernel3
          
          # Copy kernels
          find kernels -name "Image.*" -exec cp {} AnyKernel3/ \;
          
          # Create ZIP
          ZIP_NAME="BakaSU_AK3${{ github.event.inputs.localVersion }}_${BUILD_TIME}.zip"
          cd AnyKernel3
          zip -r9 "../$ZIP_NAME" * -x .git/*
          cd ..
          echo "ZIP_PATH=$(pwd)/$ZIP_NAME" >> $GITHUB_ENV
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: "📤 Upload final package"
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ZIP_NAME }}
          path: ${{ env.ZIP_PATH }}
          retention-days: 7

      - name: "📱 Send to Telegram"
        if: always()
        run: |
          if [[ -f "${{ env.ZIP_PATH }}" ]]; then
            curl -s -F document=@"${{ env.ZIP_PATH }}" \
                 -F caption="✅ Kernel Build Complete (BakaSU) - $(date '+%Y-%m-%d %H:%M:%S')" \
                 -F chat_id=${{ secrets.TELEGRAM_USER_ID }} \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument"
          else
            curl -s -X POST \
                 -d chat_id=${{ secrets.TELEGRAM_USER_ID }} \
                 -d text="❌ Kernel build failed" \
                 "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage"
          fi
